<!doctype html><html><head><meta charset="utf-8"><title>S5 Customs Studio</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#07050b;color:#fff;font-family:Segoe UI,Arial,sans-serif;overflow:hidden}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 44%,#251034 0,#0b0710 34%,#05060a 70%)}.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.22;animation:drift 8s ease-in-out infinite alternate}.o1{width:420px;height:420px;background:#8d42ff;left:10%;top:4%}.o2{width:320px;height:320px;background:#2ce0bb;right:5%;bottom:2%;animation-delay:-3s}@keyframes drift{to{transform:translate3d(40px,-28px,0) scale(1.14)}}.card{position:relative;width:min(600px,88vw);padding:42px 42px 34px;border-radius:30px;text-align:center;background:linear-gradient(145deg,rgba(20,11,30,.94),rgba(8,9,15,.96));border:1px solid rgba(186,102,255,.3);box-shadow:0 35px 120px #000b,0 0 85px rgba(155,72,255,.12);animation:cardIn .7s cubic-bezier(.2,.8,.2,1)}@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97);filter:blur(10px)}}.logo{width:82px;height:82px;margin:0 auto 18px;border-radius:24px;background:linear-gradient(135deg,#a353ff,#5834ca);box-shadow:0 0 42px rgba(167,83,255,.32);display:grid;place-items:center;font-size:29px;font-weight:950;position:relative;overflow:hidden}.logo:after{content:'';position:absolute;inset:-50%;background:conic-gradient(transparent 60%,rgba(255,255,255,.42),transparent 78%);animation:spin 2.5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:44px;letter-spacing:-.045em;margin:0 0 8px}p{font-size:16px;color:#b7a5c8;margin:0}.status{font-size:15px;color:#e1cef3;margin-top:24px;font-weight:700}.sub{font-size:12px;color:#81758e;margin-top:7px;min-height:18px}.bar{height:10px;margin:22px 0 4px;background:#ffffff10;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:38%;background:linear-gradient(90deg,#7f50ff,#c47cff,#3de5be);border-radius:999px;box-shadow:0 0 22px rgba(162,77,255,.5);animation:travel 1.45s ease-in-out infinite}@keyframes travel{0%{transform:translateX(-90%)}50%{transform:translateX(115%)}100%{transform:translateX(280%)}}button{display:none;margin:20px auto 0;height:44px;border:0;border-radius:13px;padding:0 18px;background:linear-gradient(135deg,#a04aff,#714ae8);color:#fff;font-size:14px;font-weight:850}</style></head><body><div class="fx"><i class="orb o1"></i><i class="orb o2"></i></div><div class="card"><div class="logo">S5</div><h1>S5 Customs Studio</h1><p>FiveM creator suite</p><div id="s" class="status">Preparing Creator Hub…</div><div id="ss" class="sub">Checking the latest hosted Studio build.</div><div class="bar"><i></i></div><button id="r" onclick="go()">Retry launch</button></div><script>const B='https://tbbaker-lab.github.io/s5-customs-studio/app/latest.html';function go(){const u=new URL(B);u.searchParams.set('desktop','1');u.searchParams.set('boot',Date.now());location.replace(u.href)}setTimeout(()=>{s.textContent='Connecting to S5 Cloud…';ss.textContent='Loading editor code and checking cached assets.'},550);setTimeout(()=>{s.textContent='Opening Studio…';ss.textContent='Cloud can be slow; cached content is allowed to continue.'},1800);setTimeout(()=>{s.textContent='S5 Cloud is taking longer than usual.';ss.textContent='This is not a hard failure. The Studio may still open from cache.';r.style.display='block'},9500);setTimeout(go,300)</script></body></html>
