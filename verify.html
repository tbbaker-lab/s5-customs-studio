<!doctype html><html><head><meta charset="utf-8"><title>S5 Asset Health Check</title><style>body{font-family:system-ui;background:#09050f;color:#eee;padding:30px}pre{background:#130c1c;padding:18px;border-radius:12px;white-space:pre-wrap}button{padding:10px 16px;border:0;border-radius:9px;background:#9c43ff;color:#fff;font-weight:700}</style></head><body><h1>S5 Customs Studio — Asset Health Check</h1><p>Checks the hosted Studio and every same-origin asset chunk.</p><button onclick="run()">Run checks</button><pre id="out">Ready.</pre><script>
async function check(u,method='GET'){try{const r=await fetch(u+(u.includes('?')?'&':'?')+'health='+Date.now(),{cache:'no-store',method});return [r.ok,r.status]}catch(e){return [false,e.message]}}
async function run(){const o=document.getElementById('out');o.textContent='Checking...\n';for(const p of ['app/latest.html','app-version.json','s5-assets-manifest.json']){const [ok,s]=await check(p);o.textContent+=(ok?'PASS ':'FAIL ')+p+' — '+(typeof s==='number'?'HTTP '+s:s)+'\n'}let m;try{m=await (await fetch('s5-assets-manifest.json?health='+Date.now(),{cache:'no-store'})).json()}catch(e){o.textContent+='Manifest parse failed: '+e.message;return}let parts=0,fail=0;for(const pack of m.packs||[]){o.textContent+='\n'+pack.name+'\n';for(const c of pack.chunks||[]){parts++;const [ok,s]=await check(c.url,'HEAD');if(!ok)fail++;o.textContent+=(ok?'PASS ':'FAIL ')+c.url+' — '+(typeof s==='number'?'HTTP '+s:s)+'\n'}}o.textContent+='\nManifest packs: '+(m.packs?.length||0)+'\nManifest assets: '+(m.packs||[]).reduce((n,p)=>n+(p.assets?.length||0),0)+'\nChunks: '+parts+' · '+(fail?'FAILED '+fail:'ALL PASS')+'\n'}
</script></body></html>
