<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>S5 Asset Health Check</title>
<style>
body{font-family:system-ui;background:#09050f;color:#eee;padding:30px}
.ok{color:#66ff9b}.bad{color:#ff7070}
pre{background:#130c1c;padding:18px;border-radius:12px;white-space:pre-wrap}
button{padding:10px 16px;border:0;border-radius:9px;background:#9c43ff;color:#fff;font-weight:700}
</style>
</head>
<body>
<h1>S5 Customs Studio — Asset Health Check</h1>
<p>Checks the hosted Studio and both GitHub Release asset packs.</p>
<button onclick="run()">Run checks</button>
<pre id="out">Ready.</pre>
<script>
async function run(){
 const o=document.getElementById('out');
 o.textContent='Checking...\n';
 const checks=[
   'app/latest.html',
   'app-version.json',
   's5-assets-manifest.json',
   'https://github.com/tbbaker-lab/s5-customs-studio/releases/download/assets-v1/s5-jewellery-core-50-v1.zip',
   'https://github.com/tbbaker-lab/s5-customs-studio/releases/download/assets-v1/s5-chain-templates-pack-a-v1.zip'
 ];
 for(const p of checks){
   try{
     const u=p.startsWith('http')?p:(p+'?health='+Date.now());
     const r=await fetch(u,{cache:'no-store'});
     o.textContent+=(r.ok?'PASS ':'FAIL ')+p+' — HTTP '+r.status+'\n';
   }catch(e){
     o.textContent+='FAIL '+p+' — '+e.message+'\n';
   }
 }
 try{
   const m=await (await fetch('s5-assets-manifest.json?health='+Date.now(),{cache:'no-store'})).json();
   o.textContent+='\nManifest packs: '+(m.packs?.length||0)+'\n';
   o.textContent+='Manifest assets: '+(m.packs||[]).reduce((n,p)=>n+(p.assets?.length||0),0)+'\n';
 }catch(e){}
}
</script>
</body>
</html>
